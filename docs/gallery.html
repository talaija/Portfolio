<!DOCTYPE html>
<html>
    <head>
        <!-- What's in the <head> element is NOT for display in a web browser! 
            <head> stores "meta" information describing and setting up things ABOUT this HTML file. 
            It holds important information about the website's contents. -->
        <title>Starter HTML</title>
        <!-- The text inside the <title> element does show in the top tab of a web browser. 
            The <head> is where we will include info about styling the site, too.-->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Here is a place where we can add a little styling code called CSS to this page. 
            I used it to apply a background color to the body element.
        -->
        <link rel="stylesheet" type="text/css" href="style.css" />
        <style>
        body {
            background-color: #E8DBCF
            ; 
        
  margin: 0;
  padding: 0;
  }

h2, p {
  margin: 10px;
}

ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #987654;
}

ul li {
  float: left;
}

ul li a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

ul li a:hover {
  background-color: #E8DBCF;
}

h2 {
text-align: center;
}
</style>
        <style>
* {
  box-sizing: border-box;
}

div.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
}

div.gallery-item {
  margin: 5px;
  border: 20px solid #987654;
  width: calc(25% - 20px);
  border-radius: 15px;
}

div.gallery-item:hover {
  border: 15px solid #987654;
 
}

div.gallery-item img {
  width: 100%;
  height: auto;
}

div.gallery-item div.desc {
  padding: 15px;
  text-align: center;
}

@media only screen and (max-width: 768px) {
  div.gallery-item {
    width: calc(50% - 20px);
  }
}

@media only screen and (max-width: 480px) {
  div.gallery-item {
    width: calc(100% - 20px);
  }
}
</style>
